<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatGallery con The Cat API</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1> CatGallery</h1>

    <div class="controles">
        <button id="button">Cargar imágenes</button>
        <button id="verMas" disabled>Ver más</button>
    </div>

    <p id="estado"></p>

    <nav class="menu-galerias">
        <button id="mostrarGaleria" class="activo">
            Galería
        </button>

        <button id="mostrarFavoritos">
            Favoritos
        </button>
    </nav>


   
    <section id="seccionGaleria">

        <h2>Galería de imágenes</h2>

        <div id="galeria"></div>

    </section>


    
    <section id="seccionFavoritos">

        <h2>Galería de favoritos</h2>

        <div id="favoritos"></div>

    </section>


    <script src="JS_proyecto.js"></script>

</body>
</html>
